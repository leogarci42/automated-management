name: Compiler CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  build:
    runs-on: ubuntu-latest
    needs: [init]
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev
      - name: Build cucpp
        run: |
          make re

  tests:
    runs-on: ubuntu-latest
    needs: [init, build]
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev
      - name: Build cucpp
        run: |
          make debug
      - name: Run Integration Tests
        run:
          make test
