name: Compiler CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  tests-ubuntu:
    runs-on: ubuntu-latest
    needs: [init]
    steps:
      - name: List files and show Makefile
          run: |
            pwd
            ls -l
            cat Makefile
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev
      - name: Build cucpp
        run: |
          make re
      - name: Run Integration Tests
        run:
          make test

  tests-fedora-42:
    runs-on: fedora-42
    needs: [init]
    steps:
      - name: Install Dependencies
        run: |
          sudo dnf -y update
          sudo dnf -y install @development-tools readline-devel
      - name: Build cucpp
        run: |
          make re
      - name: Run Integration Tests
        run: |
          make test

